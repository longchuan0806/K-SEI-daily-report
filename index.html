<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日報入力</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; }
    .card { border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: none; }
    .driver-info { text-align: center; font-weight: bold; color: #007bff; margin-bottom: 12px; font-size: 15px; background: #e9f2ff; padding: 10px; border-radius: 8px; }
    .form-label { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
    .form-control, .form-select { padding: 12px; font-size: 15px; border-radius: 8px; }
    #mainContent, #initRegisterArea, #bentoDetailArea { display: none; }
    .req { color: #dc3545; font-size: 12px; margin-left: 4px; }
    .member-box { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 8px 12px; max-height: 220px; overflow-y: auto; }
    .member-item { padding: 8px 4px; border-bottom: 1px solid #dee2e6; display: flex; align-items: center; }
    .member-item:last-child { border-bottom: none; }
    .member-checkbox, .bento-checkbox { width: 22px; height: 22px; margin-right: 12px; cursor: pointer; }
    .member-label { cursor: pointer; font-size: 15px; user-select: none; margin-bottom: 0; }
    .bento-card { background-color: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 12px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container py-2" style="max-width: 520px;">
  
  <div class="driver-info" id="statusDisplay">LINE認証確認中...</div>

  <!-- 初回アカウント連携エリア -->
  <div class="card p-4 bg-white mb-3" id="initRegisterArea">
    <h5 class="text-primary font-weight-bold mb-2">🔰 初回アカウント連携</h5>
    <p class="text-muted" style="font-size: 13px;">あなたのお名前を選択して「連携する」を押してください。<br>次回以降はお名前が自動認識されます。</p>
    <div class="mb-3">
      <label for="unlinkedNameSelect" class="form-label">お名前を選択<span class="req">※必須</span></label>
      <select class="form-select" id="unlinkedNameSelect">
        <option value="">お名前を選択してください</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary w-100 py-2 font-weight-bold" onclick="submitRegistration()">連携して利用を開始する</button>
  </div>

  <!-- 日報入力メインフォーム -->
  <div class="card p-4 bg-white" id="mainContent">
    <h4 class="text-center mb-3 text-primary font-weight-bold">日報報告</h4>
    
    <form id="nippoForm">
      <!-- 現場選択 -->
      <div class="mb-3">
        <label for="genba" class="form-label">現場<span class="req">※必須</span></label>
        <select class="form-select" id="genba" required onchange="filterMembersByGenba()">
          <option value="">現場を選択してください</option>
        </select>
      </div>

      <!-- 出勤職人選択（K-SEI最優先ソート） -->
      <div class="mb-3">
        <label class="form-label">本日の出勤メンバー<span class="req">※必須（1名以上）</span></label>
        <div class="member-box" id="memberListArea">
          <div class="text-muted text-center py-3" style="font-size:13px;">現場を選択すると該当する職人が表示されます</div>
        </div>
      </div>

      <!-- 日付 -->
      <div class="mb-3">
        <label for="date" class="form-label">日付<span class="req">※必須</span></label>
        <input type="date" class="form-control" id="date" required onclick="this.showPicker()">
      </div>

      <!-- 出勤時間区分 -->
      <div class="mb-3">
        <label for="workType" class="form-label">出勤時間<span class="req">※必須</span></label>
        <select class="form-select" id="workType" required>
          <option value="定時">定時</option>
          <option value="早出">早出</option>
          <option value="半日">半日</option>
          <option value="残業">残業</option>
        </select>
      </div>

      <!-- 残業・早出等の時間 -->
      <div class="mb-3">
        <label for="overtime" class="form-label">時間外・残業時間</label>
        <input type="text" class="form-control" id="overtime" placeholder="なし の場合は空欄でOK">
      </div>

      <!-- 🍱 お弁当の有無・注文エリア -->
      <div class="mb-3">
        <div class="form-check form-switch p-2 bg-light rounded border">
          <input class="form-check-input ms-0 me-2" type="checkbox" id="hasBento" style="width: 40px; height: 20px; cursor: pointer;" onchange="toggleBentoArea()">
          <label class="form-check-label font-weight-bold" for="hasBento" style="cursor: pointer; padding-left: 8px;">🍱 本日のお弁当注文あり</label>
        </div>

        <div id="bentoDetailArea" class="bento-card">
          <div class="mb-2">
            <label for="bentoPrice" class="form-label text-dark">お弁当の単価（1個あたり・円）<span class="req">※必須</span></label>
            <input type="number" class="form-control" id="bentoPrice" placeholder="例: 460" value="460">
          </div>
          <div>
            <label class="form-label text-dark">お弁当を注文した人<span class="req">※チェック</span></label>
            <div class="member-box bg-white" id="bentoMemberListArea">
              <!-- 出勤メンバーから連動抽出 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 備考 -->
      <div class="mb-3">
        <label for="bikou" class="form-label">備考</label>
        <textarea class="form-control" id="bikou" rows="3" placeholder="作業内容や連絡事項があれば入力"></textarea>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="button" id="submitBtn" class="btn btn-primary btn-lg font-weight-bold" onclick="submitNippo()">日報を一括送信する</button>
      </div>
    </form>
  </div>
</div>

<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby0QtRfi_NLRdzfzdcwsdLN1-J22thpC8A82rYTjJ2x8NVCL4VObmtV_XVuN7QhttAW/exec";
  const MY_LIFF_ID = "2011777275-7vOnVH8G";

  let currentLineUserId = "";
  let currentEmployeeName = "";
  let masterGenbaList = [];
  let masterStaffList = [];
  let genbaDetailsMap = {};

  window.onload = function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;
    const display = document.getElementById('statusDisplay');

    liff.init({ liffId: MY_LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          display.innerText = "LINEログイン画面へ移動します...";
          liff.login();
        } else {
          return liff.getProfile();
        }
      })
      .then(profile => {
        if (!profile) return;
        currentLineUserId = profile.userId;
        display.innerText = "データ読み込み中...";
        checkUserRegistration(currentLineUserId);
      })
      .catch(err => {
        display.className = "driver-info text-danger bg-danger-subtle";
        display.innerText = "❌ LIFF初期化エラー: " + (err.message || err);
      });
  };

  function checkUserRegistration(lineUserId) {
    const display = document.getElementById('statusDisplay');
    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getUserAuth", lineUserId: lineUserId })
    })
    .then(res => res.json())
    .then(result => {
      if (!result.success) {
        display.className = "driver-info text-danger bg-danger-subtle";
        display.innerText = "❌ " + result.message;
        return;
      }

      masterGenbaList = result.genbaList || [];
      masterStaffList = result.staffList || [];
      const genbaDetails = result.genbaDetails || [];
      genbaDetails.forEach(g => {
        genbaDetailsMap[g.name] = g;
      });

      const genbaSelect = document.getElementById('genba');
      let genbaHtml = '<option value="">現場を選択してください</option>';
      masterGenbaList.forEach(item => {
        let gName = (typeof item === 'string') ? item.trim() : ((item && item.name) ? item.name.trim() : "");
        if (gName && gName !== "undefined") {
          genbaHtml += `<option value="${gName}">${gName}</option>`;
        }
      });
      genbaSelect.innerHTML = genbaHtml;

      if (result.registered) {
        currentEmployeeName = result.employeeName;
        display.innerText = "報告者: " + currentEmployeeName + " 様";
        document.getElementById('mainContent').style.display = "block";
      } else {
        display.innerText = "未連携アカウントです";
        document.getElementById('initRegisterArea').style.display = "block";
        const select = document.getElementById('unlinkedNameSelect');
        select.innerHTML = '<option value="">お名前を選択してください</option>';

        // 💡 バックアップ処理：unlinkedNamesが空でも在籍職人リストから必ず全員を並べる
        let candidateNames = result.unlinkedNames || [];
        if (candidateNames.length === 0 && masterStaffList.length > 0) {
          candidateNames = masterStaffList.map(s => s.name);
        }

        // 重複を除去してプルダウンを生成
        const uniqueNames = Array.from(new Set(candidateNames));
        uniqueNames.forEach(name => {
          if (name && name !== "undefined") {
            select.innerHTML += `<option value="${name}">${name}</option>`;
          }
        });
      }
    })
    .catch(err => {
      display.className = "driver-info text-danger bg-danger-subtle";
      display.innerText = "❌ サーバー通信エラー: " + (err.message || err);
    });
  }

  function filterMembersByGenba() {
    const genbaSelect = document.getElementById('genba');
    const selectedGenba = (genbaSelect.value || "").trim();
    const area = document.getElementById('memberListArea');

    if (!selectedGenba) {
      area.innerHTML = '<div class="text-muted text-center py-3" style="font-size:13px;">現場を選択してください</div>';
      updateBentoMemberList();
      return;
    }

    const matchedStaff = masterStaffList.filter(staff => {
      const wp = String(staff.workPlace || "").trim();
      return wp === selectedGenba;
    });

    if (matchedStaff.length === 0) {
      area.innerHTML = `<div class="text-muted text-center py-3" style="font-size:13px;">「${selectedGenba}」に登録されている職人がいません</div>`;
      updateBentoMemberList();
      return;
    }

    matchedStaff.sort((a, b) => {
      const aIsKsei = (a.company === "K-SEI") ? 0 : 1;
      const bIsKsei = (b.company === "K-SEI") ? 0 : 1;
      return aIsKsei - bIsKsei;
    });

    let html = '';
    matchedStaff.forEach((staff, index) => {
      const isSelf = (staff.name === currentEmployeeName);
      const isKsei = (staff.company === "K-SEI");
      const companyBadge = isKsei
        ? `<span class="badge bg-primary ms-1">K-SEI</span>`
        : `<span class="badge bg-secondary ms-1">${staff.company || ''}</span>`;

      html += `
        <div class="member-item">
          <input class="form-check-input member-checkbox" type="checkbox" value="${staff.name}" data-company="${staff.company || ''}" id="staff_${index}" ${isSelf ? 'checked' : ''} onchange="updateBentoMemberList()">
          <label class="member-label flex-grow-1" for="staff_${index}">
            <b>${staff.name}</b> ${companyBadge}
          </label>
        </div>
      `;
    });
    area.innerHTML = html;
    updateBentoMemberList();
  }

  function toggleBentoArea() {
    const isChecked = document.getElementById('hasBento').checked;
    document.getElementById('bentoDetailArea').style.display = isChecked ? 'block' : 'none';
    if (isChecked) updateBentoMemberList();
  }

  function updateBentoMemberList() {
    const bentoArea = document.getElementById('bentoMemberListArea');
    const checkedBoxes = Array.from(document.querySelectorAll('.member-checkbox:checked'));

    if (checkedBoxes.length === 0) {
      bentoArea.innerHTML = '<div class="text-muted text-center py-2" style="font-size:13px;">出勤メンバーにチェックを入れてください</div>';
      return;
    }

    checkedBoxes.sort((a, b) => {
      const aIsKsei = (a.getAttribute('data-company') === "K-SEI") ? 0 : 1;
      const bIsKsei = (b.getAttribute('data-company') === "K-SEI") ? 0 : 1;
      return aIsKsei - bIsKsei;
    });

    let html = '';
    checkedBoxes.forEach((cb, idx) => {
      const name = cb.value;
      const company = cb.getAttribute('data-company') || '';
      const displayLabel = (company && company !== "K-SEI") ? `${name} (${company})` : name;

      html += `
        <div class="member-item">
          <input class="form-check-input bento-checkbox" type="checkbox" value="${name}" id="bento_${idx}" checked>
          <label class="member-label flex-grow-1" for="bento_${idx}">
            🍱 <b>${displayLabel}</b>
          </label>
        </div>
      `;
    });
    bentoArea.innerHTML = html;
  }

  function submitRegistration() {
    const selectedName = document.getElementById('unlinkedNameSelect').value;
    if (!selectedName) { alert("お名前を選択してください。"); return; }

    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "registerLineUserId", empName: selectedName, lineUserId: currentLineUserId })
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      if (res.success) location.reload();
    })
    .catch(err => alert("登録通信エラー: " + err));
  }

  function submitNippo() {
    const form = document.getElementById('nippoForm');
    if (!form.checkValidity()) { form.reportValidity(); return; }

    const checkedBoxes = document.querySelectorAll('.member-checkbox:checked');
    if (checkedBoxes.length === 0) {
      alert("本日の出勤メンバーを1名以上チェックしてください。");
      return;
    }
    const selectedMembers = Array.from(checkedBoxes).map(cb => cb.value);

    const hasBento = document.getElementById('hasBento').checked;
    let bentoPrice = 0;
    let bentoOrders = [];
    if (hasBento) {
      bentoPrice = Number(document.getElementById('bentoPrice').value) || 0;
      const bentoCheckedBoxes = document.querySelectorAll('.bento-checkbox:checked');
      bentoOrders = Array.from(bentoCheckedBoxes).map(cb => cb.value);
    }

    const selectedGenbaName = document.getElementById('genba').value;
    const gDetail = genbaDetailsMap[selectedGenbaName] || {};

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "送信中...";

    const formData = {
      action: "saveReportData",
      lineUserId: currentLineUserId,
      employeeName: currentEmployeeName,
      selectedMembers: selectedMembers,
      genba: selectedGenbaName,
      workPlace: gDetail.workPlace || selectedGenbaName,
      motouke: gDetail.motouke || "",
      date: document.getElementById('date').value,
      workType: document.getElementById('workType').value,
      overtime: document.getElementById('overtime').value,
      hasBento: hasBento,
      bentoPrice: bentoPrice,
      bentoOrders: bentoOrders,
      bikou: document.getElementById('bikou').value
    };

    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      btn.disabled = false;
      btn.innerText = "日報を一括送信する";
      if (res.success) liff.closeWindow();
    })
    .catch(err => {
      alert("送信通信エラー: " + err);
      btn.disabled = false;
      btn.innerText = "日報を一括送信する";
    });
  }
</script>
</body>
</html>
